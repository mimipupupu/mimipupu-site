.cur-trail i{position:absolute;top:0;left:0;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#FFD6A3;box-shadow:0 0 6px rgba(255,214,163,.8);will-change:transform}

.cur-trail i:nth-child(4){transform:translate3d(var(--cx3,-99px),var(--cy3,-99px),0);opacity:.32;width:3px;height:3px}
.cur-trail i:nth-child(5){transform:translate3d(var(--cx4,-99px),var(--cy4,-99px),0);opacity:.2;width:2.5px;height:2.5px}
.cur-trail i:nth-child(6){transform:translate3d(var(--cx5,-99px),var(--cy5,-99px),0);opacity:.1;width:2px;height:2px}
.cur-trail .cur-head{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:0;box-shadow:none;background:#FFD6A3;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 4px rgba(255,214,163,.9));transform:translate3d(calc(var(--cx0,-99px) + 13px),calc(var(--cy0,-99px) + 15px),0)}

/* ---- Tarot commission tiers ---- */

.tc-sym{width:84px;height:84px;display:block}
.tc-name{font-family:'IM Fell English SC',Georgia,serif;font-size:23px;line-height:1.1;color:#FFD6A3}
.tc-cat{font-size:12.5px;line-height:1.35;color:#C4B2A5;max-width:190px}
.tc-hint{position:absolute;left:0;right:0;bottom:24px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#A8968A}
.tc-bname{font-family:'IM Fell English SC',Georgia,serif;font-size:19px;color:#FFD6A3}
.tc-inc{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#C9A27A}
.tc-list{display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.35;color:#E0D2C6;max-width:200px}
.tc-li::before{content:"\2726\00a0";color:#C9A27A}
.tc-price{margin-top:4px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px;color:#FAF0E8}
.tc-sel{position:absolute;left:0;right:0;bottom:22px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#FF9A5C}
/* ---- Draw a card, wax seal, sound ---- */
.seal-col{display:flex;flex-direction:column;gap:22px;align-items:center}
@media (max-width:1100px){.seal-col{display:contents}}
.sr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wax{position:relative;width:76px;height:76px;display:block}
.wax-b{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;border-radius:47% 53% 50% 48% / 52% 46% 54% 49%;background:radial-gradient(circle at 34% 28%,#F2D3A0 0,#D9AE72 28%,#B98546 62%,#7E5524 100%);box-shadow:0 0 0 3px rgba(185,133,70,.55),0 0 0 5px rgba(126,85,36,.35),0 8px 18px rgba(0,0,0,.45),inset 0 -3px 6px rgba(74,46,18,.45),inset 0 3px 5px rgba(255,236,200,.45);animation:waxStamp .75s cubic-bezier(.3,1.4,.5,1) both}
.wax-b svg{width:62px;height:62px}
.wax-ring{position:absolute;top:50%;left:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:1.5px solid #C9A27A;opacity:0;animation:waxRing .9s ease-out .42s both}
@keyframes waxStamp{0%{transform:translateY(-34px) scale(2.1) rotate(-24deg);opacity:0}55%{transform:translateY(0) scale(.9) rotate(4deg);opacity:1}75%{transform:scale(1.04) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}
@keyframes waxRing{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.9);opacity:0}}

/* ---- Header A: Celestial arch ---- */

.hdr-lk{position:relative;text-decoration:none;font-weight:500;white-space:nowrap;transition:color .25s ease}

.hdr-lk::after{content:"";position:absolute;left:50%;bottom:-9px;width:5px;height:5px;margin-left:-2.5px;background:#C9A27A;transform:rotate(45deg) scale(0);transition:transform .25s ease}

/* ---- Gilded button interactions ---- */
.btn-gild,.btn-line{position:relative;overflow:hidden;isolation:isolate;outline:1px solid rgba(201,162,122,0);outline-offset:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,outline-color .35s ease,outline-offset .35s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.btn-gild::before{content:"";position:absolute;top:-10%;bottom:-10%;left:-70%;width:45%;z-index:-1;pointer-events:none;background:linear-gradient(105deg,rgba(255,250,235,0) 0%,rgba(255,250,235,.6) 50%,rgba(255,250,235,0) 100%);transform:skewX(-20deg)}
.btn-gild:hover::before,.btn-gild:focus-visible::before{animation:gildSweep 1.05s cubic-bezier(.3,.6,.3,1) forwards}
.btn-gild.btn-ivory::before{background:linear-gradient(105deg,rgba(201,162,122,0) 0%,rgba(201,162,122,.5) 50%,rgba(201,162,122,0) 100%)}
.btn-gild.btn-ivory::after{border-color:rgba(201,162,122,.95);background:radial-gradient(circle,rgba(255,214,163,.7) 0,rgba(255,214,163,0) 70%)}
.btn-gild.btn-ivory:hover,.btn-gild.btn-ivory:focus-visible{box-shadow:0 0 0 1.5px #C9A27A,0 10px 26px rgba(0,0,0,.35),0 0 30px rgba(255,214,163,.2)}
.btn-gild.btn-ink::before{background:linear-gradient(105deg,rgba(255,214,163,0) 0%,rgba(255,214,163,.35) 50%,rgba(255,214,163,0) 100%)}
.btn-gild.btn-ink::after{border-color:rgba(255,214,163,.9)}
@keyframes gildSweep{to{left:130%}}
.btn-gild:hover,.btn-gild:focus-visible{transform:translateY(-2px);box-shadow:0 0 0 1.5px #FFD6A3,0 10px 26px rgba(255,154,92,.38),0 0 34px rgba(255,214,163,.22);outline-color:rgba(201,162,122,.75);outline-offset:5px}
.btn-line:hover,.btn-line:focus-visible{transform:translateY(-1px);box-shadow:0 0 0 1px #C9A27A,0 0 18px rgba(255,214,163,.16);outline-color:rgba(201,162,122,.45);outline-offset:4px}
.btn-gild svg,.btn-line svg{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.btn-gild:hover svg{transform:rotate(-10deg) scale(1.1)}
.btn-line:hover svg{transform:scale(1.08)}
.btn-gild:active,.btn-line:active{transform:translateY(0) scale(.96);transition-duration:.08s;outline-offset:2px}
.btn-gild::after,.btn-line::after{content:"";position:absolute;left:var(--rx,50%);top:var(--ry,50%);width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:1.5px solid rgba(255,243,220,.95);background:radial-gradient(circle,rgba(255,243,220,.85) 0,rgba(255,243,220,0) 70%);opacity:0;pointer-events:none;z-index:-1}
.btn-line::after{border-color:rgba(255,214,163,.8);background:radial-gradient(circle,rgba(255,214,163,.45) 0,rgba(255,214,163,0) 70%)}
.btn-gild.burst::after,.btn-line.burst::after{animation:gildBurst .65s cubic-bezier(.2,.7,.3,1)}
@keyframes gildBurst{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(24)}}
.scene.day .btn-line:hover{box-shadow:0 0 0 1px #B0814F,0 0 18px rgba(176,129,79,.18)}
.obs-outer,.obs-zod{transform-box:view-box;transform-origin:200px 200px;transition:transform .95s cubic-bezier(.2,.8,.2,1)}
.obs-arch.live .obs-outer,.obs-arch.live .obs-zod{transition:transform .14s linear}
.obs-arch.spin .obs-outer,.obs-arch.spin .obs-zod{transition:transform 1.7s cubic-bezier(.45,.05,.2,1)}
/* ---- Foil shine ---- */
.foil{position:absolute;top:0;left:0;right:0;bottom:0;box-sizing:border-box;border-radius:inherit;pointer-events:none;z-index:4;opacity:0;transition:opacity .35s ease;mix-blend-mode:soft-light;background:repeating-linear-gradient(115deg,rgba(255,214,163,0) 0%,rgba(255,214,163,.55) 7%,rgba(201,162,122,.25) 12%,rgba(255,214,163,0) 20%);background-size:280% 280%;background-position:var(--fx,50%) var(--fy,50%)}

.cyl-face .foil{padding:9%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.cyl-btn:hover .foil,.merch-card:hover .mf-face .foil,.tier-card:hover .tc-front .foil{opacity:1}
/* ---- Twinkling starfield ---- */
.starfield{position:absolute;top:0;left:0;width:100%;height:100%}

.tw-x{background:none;width:9px!important;height:9px!important;margin:-3px 0 0 -3px}
.tw-x::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:#FFD6A3;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%)}
@keyframes twinkle{0%,100%{opacity:.08;transform:scale(.7)}50%{opacity:.85;transform:scale(1.1)}}
.shoot{position:absolute;width:140px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,rgba(255,214,163,0),rgba(255,236,200,.95));opacity:0;transform-origin:100% 50%;animation:shoot 25s linear infinite;filter:drop-shadow(0 0 4px rgba(255,214,163,.7))}
@keyframes shoot{0%{opacity:0;transform:rotate(-28deg) translateX(0) scaleX(.2)}0.6%{opacity:1;transform:rotate(-28deg) translateX(-60px) scaleX(1)}3%{opacity:0;transform:rotate(-28deg) translateX(-340px) scaleX(.6)}100%{opacity:0;transform:rotate(-28deg) translateX(-340px)}}
.scene.day .tw,.scene.day .tw-x::before{background:#C9A27A}
.scene.day .tw-x{background:none}
.scene.day .shoot{background:linear-gradient(90deg,rgba(176,129,79,0),rgba(176,129,79,.8));filter:none}

/* ---- Cosmic character slider ---- */
.chars-card{position:relative;overflow:hidden;isolation:isolate;box-shadow:0 0 calc(var(--lv,0) * 40px) rgba(255,154,92,calc(var(--lv,0) * .32));transition:box-shadow .6s ease,border-color .4s ease}
.cc-nebula{position:absolute;top:-60%;left:calc(var(--pct,0) * 1% - 30%);width:80%;height:220%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(255,154,92,.22),rgba(201,162,122,.08) 55%,rgba(255,154,92,0));opacity:calc(.15 + var(--lv,0) * .85);transition:left .5s cubic-bezier(.2,.8,.2,1),opacity .6s ease}
.cc-stars{position:absolute;top:0;left:0;right:0;bottom:0;z-index:-1;pointer-events:none}
.cc-stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFD6A3;opacity:calc(.08 + var(--lv,0) * .75);box-shadow:0 0 calc(2px + var(--lv,0) * 6px) rgba(255,214,163,.9);animation:ccTw 3.6s ease-in-out infinite;transition:opacity .6s ease}
@keyframes ccTw{0%,100%{transform:scale(.6)}50%{transform:scale(1.25)}}
.cc-val{display:inline-block;color:var(--tx,#FAF0E8);text-shadow:0 0 calc(var(--lv,0) * 16px) rgba(255,214,163,calc(var(--lv,0) * .95)),0 0 calc(var(--lv,0) * 34px) rgba(255,154,92,calc(var(--lv,0) * .6));transition:text-shadow .5s ease}
.cc-slider{position:relative;height:30px}
.cc-track{position:absolute;left:11px;right:11px;top:50%;height:6px;margin-top:-3px;border-radius:99px;background:var(--ln,#382A22);box-shadow:inset 0 0 0 1px rgba(201,162,122,.25)}
.cc-fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--pct,0) * 1%);border-radius:inherit;background:linear-gradient(90deg,#C9A27A,#FF9A5C 60%,#FFD6A3);box-shadow:0 0 calc(4px + var(--lv,0) * 14px) rgba(255,154,92,calc(.25 + var(--lv,0) * .6));transition:width .45s cubic-bezier(.2,.8,.2,1),box-shadow .5s ease}
.cc-thumb{position:absolute;top:50%;left:calc(11px + (100% - 22px) * var(--pct,0) / 100);width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;pointer-events:none;filter:drop-shadow(0 0 1px #C9A27A) drop-shadow(0 0 calc(4px + var(--lv,0) * 12px) rgba(255,214,163,calc(.5 + var(--lv,0) * .45)));transition:left .45s cubic-bezier(.2,.8,.2,1),transform .25s ease,filter .5s ease}
.cc-thumb::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 45% 40%,#FFF6E4 0,#FFD6A3 40%,#FF9A5C 85%);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);transform:rotate(calc(var(--pct,0) * 3.6deg));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.cc-thumb::after{content:"";position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#FFF6E4;box-shadow:0 0 6px #FFF6E4}
.cc-input{position:absolute;top:0;left:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.cc-slider:hover .cc-thumb{transform:scale(1.12)}
.cc-input:active~.cc-thumb,.cc-slider:active .cc-thumb{transform:scale(1.2)}
.cc-slider:has(.cc-input:focus-visible) .cc-thumb{outline:1.5px dotted #FFD6A3;outline-offset:5px}
.cc-ticks{position:relative;height:34px;font-size:13px;color:var(--tx2,#C4B2A5)}
.cc-tick{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .4s ease,text-shadow .4s ease}
.cc-tick i{width:9px;height:9px;background:var(--ln,#4A382D);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);transition:background .4s ease}
.cc-tick.lit{color:var(--pk,#FFD6A3);text-shadow:0 0 10px rgba(255,214,163,.55)}

@keyframes ccPop{0%{transform:scale(.3) rotate(-45deg)}60%{transform:scale(1.6) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
