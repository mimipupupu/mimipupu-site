/* ---- Sparkle cursor ---- */

.cur-trail i:nth-child(5){transform:translate3d(var(--cx4,-99px),var(--cy4,-99px),0);opacity:.2;width:2.5px;height:2.5px}
.cur-trail i:nth-child(6){transform:translate3d(var(--cx5,-99px),var(--cy5,-99px),0);opacity:.1;width:2px;height:2px}
.cur-trail .cur-head{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:0;box-shadow:none;background:#FFD6A3;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 4px rgba(255,214,163,.9));transform:translate3d(calc(var(--cx0,-99px) + 13px),calc(var(--cy0,-99px) + 15px),0)}

/* ---- Tarot commission tiers ---- */

.tier-card:hover .tc-in{translate:0 -6px}
.tier-card:focus-visible{outline:2px solid #FFD6A3;outline-offset:5px}
.tc-side{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:14px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:38px 22px 34px;box-sizing:border-box}
.tc-front{background:radial-gradient(circle at 50% 36%,rgba(255,214,163,.10),rgba(255,214,163,0) 58%),#1A1411;box-shadow:0 14px 34px rgba(0,0,0,.35)}

.tc-sym{width:84px;height:84px;display:block}
.tc-name{font-family:'IM Fell English SC',Georgia,serif;font-size:23px;line-height:1.1;color:#FFD6A3}
.tc-cat{font-size:12.5px;line-height:1.35;color:#C4B2A5;max-width:190px}
.tc-hint{position:absolute;left:0;right:0;bottom:24px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#A8968A}
.tc-bname{font-family:'IM Fell English SC',Georgia,serif;font-size:19px;color:#FFD6A3}
.tc-inc{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#C9A27A}
.tc-list{display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.35;color:#E0D2C6;max-width:200px}
.tc-li::before{content:"\2726\00a0";color:#C9A27A}
.tc-price{margin-top:4px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px;color:#FAF0E8}
.tc-sel{position:absolute;left:0;right:0;bottom:22px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#FF9A5C}
/* ---- Draw a card, wax seal, sound ---- */
.seal-col{display:flex;flex-direction:column;gap:22px;align-items:center}

.sr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wax{position:relative;width:76px;height:76px;display:block}
.wax-b{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;border-radius:47% 53% 50% 48% / 52% 46% 54% 49%;background:radial-gradient(circle at 34% 28%,#F2D3A0 0,#D9AE72 28%,#B98546 62%,#7E5524 100%);box-shadow:0 0 0 3px rgba(185,133,70,.55),0 0 0 5px rgba(126,85,36,.35),0 8px 18px rgba(0,0,0,.45),inset 0 -3px 6px rgba(74,46,18,.45),inset 0 3px 5px rgba(255,236,200,.45);animation:waxStamp .75s cubic-bezier(.3,1.4,.5,1) both}

@keyframes waxStamp{0%{transform:translateY(-34px) scale(2.1) rotate(-24deg);opacity:0}55%{transform:translateY(0) scale(.9) rotate(4deg);opacity:1}75%{transform:scale(1.04) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}

/* ---- Header A: Celestial arch ---- */

.hdr-lk{position:relative;text-decoration:none;font-weight:500;white-space:nowrap;transition:color .25s ease}

.hdr-lk::after{content:"";position:absolute;left:50%;bottom:-9px;width:5px;height:5px;margin-left:-2.5px;background:#C9A27A;transform:rotate(45deg) scale(0);transition:transform .25s ease}

/* ---- Gilded button interactions ---- */
.btn-gild,.btn-line{position:relative;overflow:hidden;isolation:isolate;outline:1px solid rgba(201,162,122,0);outline-offset:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,outline-color .35s ease,outline-offset .35s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.btn-gild::before{content:"";position:absolute;top:-10%;bottom:-10%;left:-70%;width:45%;z-index:-1;pointer-events:none;background:linear-gradient(105deg,rgba(255,250,235,0) 0%,rgba(255,250,235,.6) 50%,rgba(255,250,235,0) 100%);transform:skewX(-20deg)}
.btn-gild:hover::before,.btn-gild:focus-visible::before{animation:gildSweep 1.05s cubic-bezier(.3,.6,.3,1) forwards}
.btn-gild.btn-ivory::before{background:linear-gradient(105deg,rgba(201,162,122,0) 0%,rgba(201,162,122,.5) 50%,rgba(201,162,122,0) 100%)}
.btn-gild.btn-ivory::after{border-color:rgba(201,162,122,.95);background:radial-gradient(circle,rgba(255,214,163,.7) 0,rgba(255,214,163,0) 70%)}
.btn-gild.btn-ivory:hover,.btn-gild.btn-ivory:focus-visible{box-shadow:0 0 0 1.5px #C9A27A,0 10px 26px rgba(0,0,0,.35),0 0 30px rgba(255,214,163,.2)}
.btn-gild.btn-ink::before{background:linear-gradient(105deg,rgba(255,214,163,0) 0%,rgba(255,214,163,.35) 50%,rgba(255,214,163,0) 100%)}
.btn-gild.btn-ink::after{border-color:rgba(255,214,163,.9)}
@keyframes gildSweep{to{left:130%}}
.btn-gild:hover,.btn-gild:focus-visible{transform:translateY(-2px);box-shadow:0 0 0 1.5px #FFD6A3,0 10px 26px rgba(255,154,92,.38),0 0 34px rgba(255,214,163,.22);outline-color:rgba(201,162,122,.75);outline-offset:5px}
.btn-line:hover,.btn-line:focus-visible{transform:translateY(-1px);box-shadow:0 0 0 1px #C9A27A,0 0 18px rgba(255,214,163,.16);outline-color:rgba(201,162,122,.45);outline-offset:4px}
.btn-gild svg,.btn-line svg{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.btn-gild:hover svg{transform:rotate(-10deg) scale(1.1)}
.btn-line:hover svg{transform:scale(1.08)}
.btn-gild:active,.btn-line:active{transform:translateY(0) scale(.96);transition-duration:.08s;outline-offset:2px}
.btn-gild::after,.btn-line::after{content:"";position:absolute;left:var(--rx,50%);top:var(--ry,50%);width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:1.5px solid rgba(255,243,220,.95);background:radial-gradient(circle,rgba(255,243,220,.85) 0,rgba(255,243,220,0) 70%);opacity:0;pointer-events:none;z-index:-1}
.btn-line::after{border-color:rgba(255,214,163,.8);background:radial-gradient(circle,rgba(255,214,163,.45) 0,rgba(255,214,163,0) 70%)}
.btn-gild.burst::after,.btn-line.burst::after{animation:gildBurst .65s cubic-bezier(.2,.7,.3,1)}
@keyframes gildBurst{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(24)}}
.scene.day .btn-line:hover{box-shadow:0 0 0 1px #B0814F,0 0 18px rgba(176,129,79,.18)}
.obs-outer,.obs-zod{transform-box:view-box;transform-origin:200px 200px;transition:transform .95s cubic-bezier(.2,.8,.2,1)}
.obs-arch.live .obs-outer,.obs-arch.live .obs-zod{transition:transform .14s linear}
.obs-arch.spin .obs-outer,.obs-arch.spin .obs-zod{transition:transform 1.7s cubic-bezier(.45,.05,.2,1)}
/* ---- Foil shine ---- */
.foil{position:absolute;top:0;left:0;right:0;bottom:0;box-sizing:border-box;border-radius:inherit;pointer-events:none;z-index:4;opacity:0;transition:opacity .35s ease;mix-blend-mode:soft-light;background:repeating-linear-gradient(115deg,rgba(255,214,163,0) 0%,rgba(255,214,163,.55) 7%,rgba(201,162,122,.25) 12%,rgba(255,214,163,0) 20%);background-size:280% 280%;background-position:var(--fx,50%) var(--fy,50%)}

.cyl-face .foil{padding:9%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.cyl-btn:hover .foil,.merch-card:hover .mf-face .foil,.tier-card:hover .tc-front .foil{opacity:1}

@keyframes twinkle{0%,100%{opacity:.08;transform:scale(.7)}50%{opacity:.85;transform:scale(1.1)}}
.shoot{position:absolute;width:140px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,rgba(255,214,163,0),rgba(255,236,200,.95));opacity:0;transform-origin:100% 50%;animation:shoot 25s linear infinite;filter:drop-shadow(0 0 4px rgba(255,214,163,.7))}
@keyframes shoot{0%{opacity:0;transform:rotate(-28deg) translateX(0) scaleX(.2)}0.6%{opacity:1;transform:rotate(-28deg) translateX(-60px) scaleX(1)}3%{opacity:0;transform:rotate(-28deg) translateX(-340px) scaleX(.6)}100%{opacity:0;transform:rotate(-28deg) translateX(-340px)}}

/* ---- Cosmic character slider ---- */
.chars-card{position:relative;overflow:hidden;isolation:isolate;box-shadow:0 0 calc(var(--lv,0) * 40px) rgba(255,154,92,calc(var(--lv,0) * .32));transition:box-shadow .6s ease,border-color .4s ease}
.cc-nebula{position:absolute;top:-60%;left:calc(var(--pct,0) * 1% - 30%);width:80%;height:220%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(255,154,92,.22),rgba(201,162,122,.08) 55%,rgba(255,154,92,0));opacity:calc(.15 + var(--lv,0) * .85);transition:left .5s cubic-bezier(.2,.8,.2,1),opacity .6s ease}
.cc-stars{position:absolute;top:0;left:0;right:0;bottom:0;z-index:-1;pointer-events:none}
.cc-stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFD6A3;opacity:calc(.08 + var(--lv,0) * .75);box-shadow:0 0 calc(2px + var(--lv,0) * 6px) rgba(255,214,163,.9);animation:ccTw 3.6s ease-in-out infinite;transition:opacity .6s ease}
@keyframes ccTw{0%,100%{transform:scale(.6)}50%{transform:scale(1.25)}}
.cc-val{display:inline-block;color:var(--tx,#FAF0E8);text-shadow:0 0 calc(var(--lv,0) * 16px) rgba(255,214,163,calc(var(--lv,0) * .95)),0 0 calc(var(--lv,0) * 34px) rgba(255,154,92,calc(var(--lv,0) * .6));transition:text-shadow .5s ease}
.cc-slider{position:relative;height:30px}
.cc-track{position:absolute;left:11px;right:11px;top:50%;height:6px;margin-top:-3px;border-radius:99px;background:var(--ln,#382A22);box-shadow:inset 0 0 0 1px rgba(201,162,122,.25)}
.cc-fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--pct,0) * 1%);border-radius:inherit;background:linear-gradient(90deg,#C9A27A,#FF9A5C 60%,#FFD6A3);box-shadow:0 0 calc(4px + var(--lv,0) * 14px) rgba(255,154,92,calc(.25 + var(--lv,0) * .6));transition:width .45s cubic-bezier(.2,.8,.2,1),box-shadow .5s ease}
.cc-thumb{position:absolute;top:50%;left:calc(11px + (100% - 22px) * var(--pct,0) / 100);width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;pointer-events:none;filter:drop-shadow(0 0 1px #C9A27A) drop-shadow(0 0 calc(4px + var(--lv,0) * 12px) rgba(255,214,163,calc(.5 + var(--lv,0) * .45)));transition:left .45s cubic-bezier(.2,.8,.2,1),transform .25s ease,filter .5s ease}
.cc-thumb::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 45% 40%,#FFF6E4 0,#FFD6A3 40%,#FF9A5C 85%);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);transform:rotate(calc(var(--pct,0) * 3.6deg));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.cc-thumb::after{content:"";position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#FFF6E4;box-shadow:0 0 6px #FFF6E4}
.cc-input{position:absolute;top:0;left:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.cc-slider:hover .cc-thumb{transform:scale(1.12)}
.cc-input:active~.cc-thumb,.cc-slider:active .cc-thumb{transform:scale(1.2)}

.cc-ticks{position:relative;height:34px;font-size:13px;color:var(--tx2,#C4B2A5)}

.cc-tick i{width:9px;height:9px;background:var(--ln,#4A382D);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);transition:background .4s ease}

@keyframes ccPop{0%{transform:scale(.3) rotate(-45deg)}60%{transform:scale(1.6) rotate(10deg)}100%{transform:scale(1) rotate(0)}}

                    <svg class="tc-sym" viewBox="36 16 28 28"><circle cx="50" cy="30" r="12.5" fill="none" stroke="#C9A27A" stroke-width=".35"></circle><circle cx="50" cy="30" r="11" fill="none" stroke="#C9A27A" stroke-width=".2" stroke-dasharray=".6 .9"></circle><path d="{{t.soft}}" fill="#FFD6A3" fill-opacity=".35"></path><path d="{{t.ln2}}" fill="none" stroke="#C9A27A" stroke-width=".26" stroke-dasharray="{{t.dash}}"></path><path d="{{t.ln}}" fill="none" stroke="#FFD6A3" stroke-width=".42"></path><path d="{{t.sym}}" fill="#FFD6A3" fill-rule="evenodd"></path></svg>

                    <span class="tc-cat">{{t.name}}</span>
                    <span class="tc-hint">Choose to reveal</span>
                  </span>

                    <span class="tnum">{{t.numeral}}</span>
                    <span class="tc-bname">{{t.tarot}}</span>
                    <span class="tc-inc">Includes</span>
                    <span class="tc-list"><sc-for list="{{t.incl}}" as="it" hint-placeholder-count="4"><span class="tc-li">{{it.text}}</span></sc-for></span>
                    <span class="tc-price">from {{t.priceLabel}}</span>
                    <span class="tc-sel">Selected</span>
                  </span>

          </div>

          <div class="ex-strip">
            <div class="ex-head"><span class="ex-eyebrow">✦ Past work</span><span class="ex-title" aria-live="polite">{{exTitle}}</span></div>

              <sc-for list="{{examples}}" as="e" hint-placeholder-count="2">
                <button type="button" class="ex-thumb" onClick="{{e.open}}" aria-label="View larger: {{e.alt}}" style="background: {{e.bg}}"><img src="{{e.src}}" alt="" loading="lazy"><span class="ex-zoom" aria-hidden="true">⤢</span></button>
              </sc-for>
            </div>
          </div>
          <sc-if value="{{exShow}}" hint-placeholder-val="{{ false }}">
            <div class="ex-lb" role="dialog" aria-modal="true" aria-label="Commission example" onKeyDown="{{exKey}}">
              <button type="button" class="ex-lb-bg" aria-label="Close example" onClick="{{exClose}}"></button>
              <img src="{{exImg}}" alt="{{exAlt}}" style="background: {{exBg}}">
              <button type="button" class="ex-lb-x" aria-label="Close example" onClick="{{exClose}}">✕</button>

                  </sc-for>
                </div>
              </div>
            </sc-if>
          </div>

          <div>
            <h3 style="margin: 0 0 14px; font-size: 15px; font-weight: 600; color: var(--tx2, #C4B2A5)">2. Background</h3>
            <div role="group" aria-label="Background" style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{bgs}}" as="b" hint-placeholder-count="3">
                <button class="btn-line" type="button" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid {{b.border}}; background: {{b.bg}}; color: {{b.fg}}; font-size: 15px; font-weight: 500">{{b.label}} <span style="opacity: .75">{{b.priceLabel}}</span></button>
              </sc-for>
            </div>
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 32px">
            <div>
              <h3 style="margin: 0 0 14px; font-size: 15px; font-weight: 600; color: var(--tx2, #C4B2A5)">3. Usage</h3>
              <label style="display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--ln, #4A382D); cursor: pointer">

                Commercial use (+{{commercialPct}}%)
              </label>
            </div>
          </div>

          <div>
            <h3 style="margin: 0 0 14px; font-size: 15px; font-weight: 600; color: var(--tx2, #C4B2A5)">4. Add extra features</h3>
            <sc-if value="{{showChars}}" hint-placeholder-val="{{ true }}">
              <div class="chars-card" style="--lv: {{charsLv}}; --pct: {{charsPct}}; margin-bottom: 14px; padding: 18px 20px; border-radius: 14px; border: 1.5px solid {{charsBorder}}; display: flex; flex-direction: column; gap: 12px">
                <span class="cc-nebula" aria-hidden="true"></span>
                <span class="cc-stars" aria-hidden="true"><i style="left: 6%; top: 18%; animation-delay: -0.4s"></i><i style="left: 22%; top: 72%; animation-delay: -1.6s"></i><i style="left: 38%; top: 12%; animation-delay: -2.3s"></i><i style="left: 54%; top: 80%; animation-delay: -0.9s"></i><i style="left: 67%; top: 26%; animation-delay: -3.1s"></i><i style="left: 81%; top: 64%; animation-delay: -1.2s"></i><i style="left: 93%; top: 14%; animation-delay: -2.7s"></i><i style="left: 46%; top: 46%; animation-delay: -1.9s"></i><i style="left: 12%; top: 52%; animation-delay: -3.4s"></i><i style="left: 74%; top: 88%; animation-delay: -0.2s"></i></span>
                <div style="position: relative; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
                  <label for="chars-range" style="font-weight: 500">{{charsLabel}}</label>
                  <span class="cc-val" aria-live="polite" style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 19px">{{charsValue}}</span>
                </div>
                <div class="cc-slider">
                  <div class="cc-track" aria-hidden="true"><span class="cc-fill"></span></div>
                  <span class="cc-thumb" aria-hidden="true"></span>
                  <input id="chars-range" class="cc-input" type="range" min="{{charsMin}}" max="{{charsMax}}" step="1" value="{{charsVal}}" onInput="{{onChars}}">
                </div>
                <div class="cc-ticks" aria-hidden="true">
                  <sc-for list="{{charsTicks}}" as="tk" hint-placeholder-count="4">
                    <span class="cc-tick {{tk.cls}}" style="left: calc(11px + (100% - 22px) * {{tk.p}} / 100)"><i></i>{{tk.n}}</span>
                  </sc-for>
                </div>
                <span style="position: relative; font-size: 13px; color: var(--tx2, #C4B2A5)">{{charsHint}}</span>
              </div>
            </sc-if>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px">

                <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid {{a.border}}; background: {{a.bg}}; cursor: pointer">
                  <input type="checkbox" checked="{{a.on}}" onChange="{{a.toggle}}" style="width: 20px; height: 20px; flex-shrink: 0; accent-color: {{accent}}">
                  <span style="display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0">
                    <span style="font-weight: 500">{{a.label}}</span>
                    <span style="font-size: 13px; color: var(--tx2, #C4B2A5)">{{a.desc}}</span>
                  </span>
                  <span style="font-weight: 600; white-space: nowrap">+{{a.priceLabel}}</span>
                </label>
              </sc-for>
            </div>
          </div>
        </div>

        <!-- summary -->
        <aside aria-label="Price summary" style="flex: 1 1 320px; min-width: 0; padding: 28px; border-radius: 20px; background: var(--s2, #261D18); color: var(--tx, #FAF0E8); display: flex; flex-direction: column; gap: 14px">

          <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
            <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px">

            <span style="font-weight: 600">Estimated total</span>
            <span aria-live="polite" style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: {{accentText}}">{{total}}</span>

          <a class="btn-gild btn-ivory" href="#request" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px; background: var(--ivbg, #FAF0E8); color: var(--ivfg, #141414); font-weight: 600; text-decoration: none">Continue to request</a>
        </aside>

      <!-- REQUEST FORM -->
      <div id="request" class="req-card" style="margin-top: 64px; padding: 46px 40px 40px; border-radius: 18px">
        <span class="tframe" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><i class="bm"></i></span>
        <sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 22px">
            <div>
              <p class="req-eyebrow">✦ The final step ✦</p>
              <h3 class="req-h" style="margin: 0 0 6px; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 24px">{{formTitle}}</h3>
              <div class="req-orn" aria-hidden="true"><span></span><i></i><span></span></div>
              <p style="margin: 0; color: var(--tx2, #C4B2A5)">Selected: {{summaryLine}}</p>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 18px">
              <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500">Name
                <input type="text" autocomplete="name" onInput="{{onName}}" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--ln, #4A382D); background: var(--s2, #211915); color: var(--tx, #FAF0E8); font-size: 16px">

              <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500">Email

              </label>
              <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500">Reference link (optional)

              </label>

            <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500">Tell me about your idea
              <textarea rows="5" onInput="{{onBrief}}" placeholder="Character, pose, mood, colours…" style="padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--ln, #4A382D); background: var(--s2, #211915); color: var(--tx, #FAF0E8); font-size: 16px; resize: vertical"></textarea>
            </label>
            <fieldset style="margin: 0; padding: 20px; min-width: 0; border-radius: 16px; border: 1.5px solid var(--ln, #382A22); display: flex; flex-direction: column; gap: 14px">
              <legend style="padding: 0 6px; font-size: 14px; font-weight: 600">Payment</legend>
              <div role="group" aria-label="Where are you paying from?" style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{regions}}" as="r" hint-placeholder-count="2">
                  <button class="btn-line" type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid {{r.border}}; background: {{r.bg}}; color: {{r.fg}}; font-size: 15px; font-weight: 500">{{r.label}}</button>
                </sc-for>
              </div>
              <div role="group" aria-label="Payment method" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
                <sc-for list="{{payMethods}}" as="m" hint-placeholder-count="2">
                  <button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 72px; padding: 14px 16px; border-radius: 14px; border: 2px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; text-align: left">
                    <span style="font-weight: 600">{{m.name}}</span>
                    <span style="font-size: 13px; opacity: .8">{{m.desc}}</span>
                  </button>
                </sc-for>
              </div>
              <div style="padding: 16px; border-radius: 12px; background: var(--s2, #211915); display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px">
                  <span style="font-weight: 600">{{pay.name}}</span>
                  <span>Amount: <strong>{{payAmount}}</strong></span>
                </div>
                <sc-if value="{{pay.hasDetails}}" hint-placeholder-val="{{ false }}">
                  <p style="margin: 0; color: var(--tx2, #E8DACF); white-space: pre-line">{{pay.details}}</p>
                </sc-if>
                <sc-if value="{{pay.hasQr}}" hint-placeholder-val="{{ false }}">
                  <img src="{{pay.qr}}" alt="{{pay.qrAlt}}" width="220" style="display: block; width: 220px; max-width: 100%; height: auto; border-radius: 12px; background: #FFFFFF">
                </sc-if>
                <sc-if value="{{pay.hasLink}}" hint-placeholder-val="{{ false }}">
                  <a class="btn-gild btn-ivory" href="{{pay.href}}" target="_blank" rel="noopener noreferrer" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; background: var(--ivbg, #FAF0E8); color: var(--ivfg, #141414); font-weight: 600; text-decoration: none">{{pay.cta}}</a>
                </sc-if>
                <sc-if value="{{pay.missingLink}}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 13px; color: #FFB199">Payment link not added yet.</span>
                </sc-if>
                <div class="ref-box"><span class="ref-label">Your order code</span><span class="ref-code">{{refCode}}</span><span class="ref-tip">Type this in the payment reference / note so I can match your payment.</span></div>
                <span style="font-size: 13px; color: var(--tx2, #C4B2A5)">Pay once I've confirmed your request and final price.</span>
              </div>
            </fieldset>
            <sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
              <p role="alert" style="margin: 0; color: #FFB199; font-weight: 500">{{error}}</p>
            </sc-if>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
              <button class="btn-gild" type="button" onClick="{{submit}}" style="min-height: 52px; padding: 0 28px; border-radius: 999px; border: 0; background: {{accent}}; color: #3A1A06; font-size: 16px; font-weight: 600">{{submitLabel}}</button>
              <span style="font-size: 14px; color: var(--tx2, #C4B2A5)">I usually reply within a day.</span>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{submitted}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; flex-direction: column; gap: 14px; align-items: flex-start">
            <span class="wax" aria-hidden="true">
              <span class="wax-ring"></span>
              <span class="wax-b"><svg viewBox="0 0 60 60" width="60" height="60"><circle cx="30" cy="30" r="20" fill="none" stroke="rgba(74,46,18,.55)" stroke-width="1.2"></circle><circle cx="30" cy="30" r="16.5" fill="none" stroke="rgba(74,46,18,.35)" stroke-width=".8" stroke-dasharray="1.2 2"></circle><path d="M30 17.5l2.4 9.3 9.3 2.4-9.3 2.4-2.4 9.3-2.4-9.3-9.3-2.4 9.3-2.4z" fill="rgba(74,46,18,.62)"></path><path d="M30 19.5l1.7 8 8 1.7-8 1.7-1.7 8-1.7-8-8-1.7 8-1.7z" fill="rgba(255,236,200,.35)"></path></svg></span>
            </span>
            <h3 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 24px">Thanks, {{name}}! Request received.</h3>
            <p style="margin: 0; color: var(--tx2, #C4B2A5)">{{summaryLine}} · estimated {{total}}. Payment via {{pay.name}} ({{payAmount}}). A confirmation will go to {{email}}.</p>
            <div class="ref-box"><span class="ref-label">Your order code</span><span class="ref-code">{{refCode}}</span><span class="ref-tip">When you pay, put this code in the payment reference / note.</span></div>
            <div class="proof-row">
              <sc-if value="{{hasProofForm}}" hint-placeholder-val="{{ false }}"><a class="btn-line" href="{{proofHref}}" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #C9A27A; color: var(--pk, #FFD6A3); font-weight: 600; text-decoration: none">↑ Upload proof of payment</a></sc-if>
              <a href="{{proofMail}}" class="proof-mail">Or email your receipt with your order code</a>
            </div>
            <button class="btn-line" type="button" onClick="{{reset}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1.5px solid var(--ivbg, #FAF0E8); background: transparent; color: var(--tx, #FAF0E8); font-weight: 500">Send another request</button>
          </div>
        </sc-if>
      </div>

      <!-- QUEUE -->
      <div class="q-wrap">
        <div class="q-head">
          <div><p class="req-eyebrow">✦ The current reading ✦</p><h3 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 24px">Commission queue</h3></div>
          <sc-if value="{{queueIsExample}}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; color: var(--tx2, #C4B2A5)">Example entries — replace with your own</span></sc-if>
        </div>
        <div class="q-legend" aria-hidden="true">
          <sc-for list="{{stageLegend}}" as="g" hint-placeholder-count="5"><span><i class="q-moon {{g.cls}}"></i>{{g.label}}</span></sc-for>
        </div>
        <ol class="q-list">
          <sc-for list="{{queue}}" as="q" hint-placeholder-count="4">
            <li class="q-row">
              <span class="q-num">{{q.numeral}}</span>

              <span class="q-moons" role="img" aria-label="Stage {{q.stepN}} of 5: {{q.stage}}"><i class="q-phase {{q.phase}}"></i></span>
              <span class="q-stage">{{q.stage}}</span>
            </li>
          </sc-for>
        </ol>
      </div>
    </div>
  </section>

  <!-- FAQ / TERMS -->
  <section id="terms" data-section="terms" data-reveal="{{reveal.terms}}" style="position: relative; max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 48px">
    <span aria-hidden="true" data-px="" style="position: absolute; left: -30px; top: -40px; z-index: -1; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(120px, 18vw, 240px); line-height: 1; color: rgba(255,214,163,.05); pointer-events: none; user-select: none; transform: translate3d(0, calc(var(--sp, 0) * 90px), 0)">04</span>
    <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <div>
        <p style="margin: 0 0 8px; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--pk, #FFD6A3)"><svg aria-hidden="true" viewBox="0 0 100 100" style="display: inline-block; width: 11px; height: 11px; vertical-align: 0; margin-right: 8px"><path d="M50 0 C53 38 62 47 100 50 C62 53 53 62 50 100 C47 62 38 53 0 50 C38 47 47 38 50 0Z" fill="currentColor"></path></svg>04 — Terms</p>
        <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(30px, 4.2vw, 50px); line-height: 1; letter-spacing: -0.03em">Good to know</h2>
        <div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; margin-top: 16px; color: var(--pk, #FFD6A3)"><span style="display: block; width: 56px; height: 1px; background: currentColor"></span><svg viewBox="0 0 100 100" style="width: 16px; height: 16px"><path d="M50 0 C53 38 62 47 100 50 C62 53 53 62 50 100 C47 62 38 53 0 50 C38 47 47 38 50 0Z" fill="currentColor"></path></svg><span style="display: block; width: 56px; height: 1px; background: currentColor"></span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <div style="padding: 20px; border-radius: 16px; background: var(--s2, #211915)">
          <h3 style="margin: 0 0 10px; font-size: 16px">Will draw</h3>
          <ul class="astral-list" style="margin: 0; padding-left: 0; list-style: none; color: var(--tx2, #E0D2C6); font-size: 15px">

            <li>Fanart</li>
            <li>Mech</li>
            <li>Furries</li>
            <li>Slight Gore</li>
          </ul>
        </div>
        <div style="padding: 20px; border-radius: 16px; background: var(--s2, #211915)">
          <h3 style="margin: 0 0 10px; font-size: 16px">Won't draw</h3>
          <ul class="astral-list" style="margin: 0; padding-left: 0; list-style: none; color: var(--tx2, #E0D2C6); font-size: 15px">

    </div>

      </div>
      <span>© 2026 Mimipupu</span>
    </div>
  </footer>

  <!-- CART DRAWER -->
  <sc-if value="{{cartOpen}}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-label="Close cart" tabindex="-1" onClick="{{closeCart}}" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 44; padding: 0; border: 0; background: rgba(18,14,12,.6); cursor: default"></button>
    <aside role="dialog" aria-modal="true" aria-label="Your cart" onKeyDown="{{cartKey}}" style="position: fixed; top: 0; right: 0; z-index: 45; width: min(440px, 100%); height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--s1, #1A1411); border-left: 1px solid var(--ln, #382A22); animation: cartIn .35s cubic-bezier(.2,.8,.2,1)">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--ln, #382A22)">
        <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 20px">Your cart</h2>
        <button type="button" autoFocus="{{ true }}" aria-label="Close cart" onClick="{{closeCart}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--ln, #4A382D); background: transparent; color: var(--tx, #FAF0E8); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <div style="flex: 1 1 auto; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
        <sc-if value="{{orderDone}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 14px; border: 1px solid var(--ln, #4A382D)">
            <span style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 18px; color: var(--pk, #FFD6A3)">Order request sent</span>
            <p style="margin: 0; color: var(--tx2, #D7C6B8); line-height: 1.6">Thanks, {{orderName}}! I'll confirm stock, shipping and the final total by email at {{orderEmail}}.</p>
            <div class="ref-box"><span class="ref-label">Your order code</span><span class="ref-code">{{refCode}}</span><span class="ref-tip">When you pay, put this code in the payment reference / note.</span></div>
            <div class="proof-row">
              <sc-if value="{{hasProofForm}}" hint-placeholder-val="{{ false }}"><a class="btn-line" href="{{proofHref}}" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #C9A27A; color: var(--pk, #FFD6A3); font-weight: 600; text-decoration: none">↑ Upload proof of payment</a></sc-if>
              <a href="{{proofMail}}" class="proof-mail">Or email your receipt with your order code</a>
            </div>
            <button class="btn-line" type="button" onClick="{{closeCart}}" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--ivbg, #FAF0E8); background: transparent; color: var(--tx, #FAF0E8); font-weight: 600">Keep browsing</button>
          </div>
        </sc-if>
        <sc-if value="{{cartEmpty}}" hint-placeholder-val="{{ true }}">
          <p style="margin: 0; color: var(--tx3, #A8968A)">Your cart is empty. Add a print or some Siginnas merch.</p>
        </sc-if>
        <sc-for list="{{cartItems}}" as="c" hint-placeholder-count="2">
          <div style="display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--s2, #211915)">
            <span aria-hidden="true" style="flex: 0 0 auto; width: 44px; height: 60px; border-radius: 6px; background: #F3E6D0; border: 1px solid #CDB894; padding: 3px; box-sizing: border-box"><span style="display: block; width: 100%; height: 100%; border-radius: 3px; border: 1px solid #2B1E16; background: {{c.tone}}"></span></span>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span>
              <span style="font-size: 13px; color: var(--tx3, #A8968A)">{{c.variant}} · {{c.unit}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 4px">
              <button type="button" aria-label="Fewer {{c.title}}" onClick="{{c.dec}}" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--ln, #4A382D); background: transparent; color: var(--tx, #FAF0E8)">−</button>
              <span style="min-width: 22px; text-align: center; font-weight: 700">{{c.qty}}</span>
              <button type="button" aria-label="More {{c.title}}" onClick="{{c.inc}}" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--ln, #4A382D); background: transparent; color: var(--tx, #FAF0E8)">+</button>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{cartHasItems}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 6px; border-top: 1px solid var(--ln, #382A22)">
            <sc-if value="{{cartFortune.on}}" hint-placeholder-val="{{ false }}">
              <div class="fw-cartline"><span>✦ Star dial discount · {{cartFortune.pct}}% off one art print ({{cartFortune.title}})</span><span>−{{cartFortune.amount}}</span></div>
            </sc-if>
            <div class="ship-line {{shipCls}}"><span>{{ship.label}}</span><span>{{ship.amount}}</span></div>
            <span class="ship-hint {{shipCls}}">{{ship.hint}}</span>
            <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-weight: 600">Total</span><span style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 22px; color: {{accentText}}">{{cartTotal}}</span></div>
            <span style="font-size: 13px; color: var(--tx3, #A8968A)">Shipping is based on where you're ordering from (choose below). Malaysia: RM{{shipMY}} · Overseas: {{shipIntl}} · Free on 5+ art prints.</span>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Name<input type="text" autocomplete="name" onInput="{{onOrderName}}" style="min-height: 46px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--ln, #4A382D); background: var(--bg, #120E0C); color: var(--tx, #FAF0E8); font-size: 15px"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Email<input type="email" autocomplete="email" onInput="{{onOrderEmail}}" style="min-height: 46px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--ln, #4A382D); background: var(--bg, #120E0C); color: var(--tx, #FAF0E8); font-size: 15px"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Shipping address<textarea rows="3" autocomplete="street-address" onInput="{{onOrderAddr}}" style="padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--ln, #4A382D); background: var(--bg, #120E0C); color: var(--tx, #FAF0E8); font-size: 15px; resize: vertical"></textarea></label>
            <div role="group" aria-label="Where are you ordering from?" style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{regions}}" as="r" hint-placeholder-count="2">
                <button class="btn-line" type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid {{r.border}}; background: {{r.bg}}; color: {{r.fg}}; font-size: 14px; font-weight: 600">{{r.label}}</button>
              </sc-for>
            </div>
            <span style="font-size: 13px; color: var(--tx2, #C4B2A5)">Pay with {{payMethodNames}} once I confirm · {{cartPayAmount}} · Order code {{refCode}}</span>
            <sc-if value="{{orderHasError}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; color: #FFB199; font-weight: 600">{{orderErr}}</p></sc-if>
            <button class="btn-gild" type="button" onClick="{{placeOrder}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: {{accent}}; color: #3A1A06; font-size: 15px; font-weight: 700">Send order request</button>
          </div>
        </sc-if>
      </div>
    </aside>
  </sc-if>

  <!-- ADDED TO CART TOAST -->
  <sc-if value="{{toastOn}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: fixed; left: 50%; bottom: 24px; z-index: 46; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 18px; border-radius: 999px; background: #F3E6D0; color: #2B1E16; border: 1px solid #CDB894; box-shadow: 0 16px 40px rgba(0,0,0,.45); animation: toastIn .35s cubic-bezier(.2,.8,.2,1)">
      <span style="font-weight: 700">{{toastText}}</span>
      <button class="btn-gild btn-ink" type="button" onClick="{{openCart}}" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #2B1E16; color: #F3E6D0; font-weight: 700; font-size: 13px">View cart</button>
    </div>
  </sc-if>

  <!-- ZOOM VIEWER -->
  <sc-if value="{{lbOpen}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="{{lb.title}}, zoom view" onKeyDown="{{zKey}}" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; background: rgba(18,14,12,.97); display: flex; flex-direction: column; font-family: Raleway, system-ui, sans-serif">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--ln, #2C211B)">
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 17px; color: var(--tx, #FAF0E8)">{{lb.title}}</span>
          <span style="font-size: 13px; color: var(--tx3, #A8968A)">{{lb.catLabel}} · {{lbPos}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <button type="button" aria-label="Zoom out" onClick="{{zOut}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--ln, #4A382D); background: var(--s2, #211915); color: var(--tx, #FAF0E8); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">−</button>
          <span aria-live="polite" style="min-width: 56px; text-align: center; font-weight: 600; color: var(--tx, #FAF0E8)">{{zPct}}%</span>
          <button type="button" aria-label="Zoom in" onClick="{{zIn}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--ln, #4A382D); background: var(--s2, #211915); color: var(--tx, #FAF0E8); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">+</button>
          <button class="btn-line" type="button" onClick="{{zReset}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--ln, #4A382D); background: transparent; color: var(--tx, #FAF0E8); font-size: 14px; font-weight: 600">Fit</button>
          <button type="button" autoFocus="{{ true }}" aria-label="Close zoom view" onClick="{{closeLb}}" style="margin-left: 8px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ivbg, #FAF0E8); color: var(--ivfg, #141414); display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
      </div>
      <div class="zv-stage {{zCls}}" onWheel="{{zWheel}}" onDoubleClick="{{zDbl}}" onPointerDown="{{zDown}}" onPointerMove="{{zMove}}" onPointerUp="{{zUp}}" onPointerCancel="{{zUp}}" style="position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; user-select: none">
        <div class="zv-img" style="position: absolute; top: 24px; left: 24px; right: 24px; bottom: 24px; display: flex; align-items: center; justify-content: center; transform: translate3d({{zX}}px, {{zY}}px, 0) scale({{zScale}}); transform-origin: 50% 50%">
          <sc-if value="{{lb.hasImg}}" hint-placeholder-val="{{ false }}">
            <img src="{{lb.img}}" alt="{{lb.alt}}" draggable="false" style="display: block; max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none">
          </sc-if>
          <sc-if value="{{lb.noImg}}" hint-placeholder-val="{{ true }}">
            <div style="height: 100%; max-width: 100%; aspect-ratio: {{lb.ratio}}; border-radius: 12px; background: {{lb.tone}}; display: flex; align-items: center; justify-content: center; color: #3C3C44; font-weight: 500">Full-size artwork</div>
          </sc-if>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-top: 1px solid var(--ln, #2C211B)">
        <button class="btn-line" type="button" onClick="{{prevLb}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--ln, #4A382D); background: transparent; color: var(--tx, #FAF0E8); font-size: 14px; font-weight: 600">‹ Previous</button>
        <span style="font-size: 13px; color: var(--tx3, #A8968A); text-align: center">Scroll, pinch or double-click to zoom · Drag to look around · Esc to close</span>
        <button class="btn-line" type="button" onClick="{{nextLb}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--ln, #4A382D); background: transparent; color: var(--tx, #FAF0E8); font-size: 14px; font-weight: 600">Next ›</button>
      </div>
    </div>
  </sc-if>
</div>
</template>
<script src="dc.js"></script>
<script src="app.js"></script>
</body>
</html>
